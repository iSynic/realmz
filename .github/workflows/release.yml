name: Release builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Label used for test-build artifacts; releases are published after package verification"
        required: false
        type: string
      linux_diagnostics:
        description: "Run only Linux with AddressSanitizer for startup diagnostics"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PHOSG_REV: b2e0c12edb7e274a5e20c460f44eee44f49f57ef
  RESOURCE_DASM_REV: 27f64c89a5fed855e68c2a5e97b6c6c389d8eb19
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  windows:
    name: Windows
    if: ${{ !inputs.linux_diagnostics }}
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required SDL projects
        shell: bash
        run: git submodule update --init vendored/SDL vendored/SDL_ttf vendored/SDL_image

      - name: Install build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-zlib

      - name: Download SDL_ttf dependencies
        run: |
          if [ ! -f vendored/SDL_ttf/external/freetype/CMakeLists.txt ]; then
            sed -i 's/\r$//' vendored/SDL_ttf/external/download.sh vendored/SDL_ttf/.gitmodules
            bash vendored/SDL_ttf/external/download.sh
          fi

      - name: Build phosg and resource_dasm
        run: |
          set -euxo pipefail
          deps="$RUNNER_TEMP/realmz-deps"
          mkdir -p "$deps"
          git clone https://github.com/fuzziqersoftware/phosg "$RUNNER_TEMP/phosg"
          git -C "$RUNNER_TEMP/phosg" checkout "$PHOSG_REV"
          cmake -S "$RUNNER_TEMP/phosg" -B "$RUNNER_TEMP/phosg-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps"
          cmake --build "$RUNNER_TEMP/phosg-build" --parallel
          cmake --install "$RUNNER_TEMP/phosg-build"

          git clone https://github.com/fuzziqersoftware/resource_dasm "$RUNNER_TEMP/resource_dasm"
          git -C "$RUNNER_TEMP/resource_dasm" checkout "$RESOURCE_DASM_REV"
          cmake -S "$RUNNER_TEMP/resource_dasm" -B "$RUNNER_TEMP/resource_dasm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps" \
            -DCMAKE_PREFIX_PATH="$deps"
          cmake --build "$RUNNER_TEMP/resource_dasm-build" --parallel
          cmake --install "$RUNNER_TEMP/resource_dasm-build"

      - name: Build and install Realmz
        run: |
          set -euxo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/realmz-deps;/clang64" \
            -DSDLTTF_VENDORED=ON \
            -DSDLIMAGE_VENDORED=OFF
          cmake --build build-release --target Realmz --parallel
          cmake --install build-release --prefix install
          cp /clang64/bin/libc++.dll install/bin/
          cp /clang64/bin/libunwind.dll install/bin/
          cp /clang64/bin/zlib1.dll install/bin/
          test -f install/bin/Realmz.exe
          cmp "base/Realmz/Realmz Music/Outdoor Music" "install/bin/Realmz Music/Outdoor Music"
          cmp "base/Realmz/Data Files/The Family Jewels.rsrc" "install/bin/Data Files/The Family Jewels.rsrc"
          for runtime in SDL3.dll SDL3_ttf.dll SDL3_image.dll libc++.dll libunwind.dll zlib1.dll; do
            test -f "install/bin/$runtime"
          done

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\install\bin\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\Realmz-$env:RELEASE_TAG-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realmz-Windows
          path: Realmz-*-Windows.zip

  macos:
    name: macOS universal
    if: ${{ !inputs.linux_diagnostics }}
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required SDL projects
        shell: bash
        run: git submodule update --init vendored/SDL vendored/SDL_ttf vendored/SDL_image

      - name: Install build tools
        run: brew install ninja

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/realmz-deps
          key: macos-universal-deps-${{ env.PHOSG_REV }}-${{ env.RESOURCE_DASM_REV }}

      - name: Build native dependencies
        run: |
          set -euxo pipefail
          deps="$RUNNER_TEMP/realmz-deps"
          if [ ! -f "$deps/lib/cmake/phosg/phosgConfig.cmake" ]; then
            mkdir -p "$deps"
            git clone https://github.com/fuzziqersoftware/phosg "$RUNNER_TEMP/phosg"
            git -C "$RUNNER_TEMP/phosg" checkout "$PHOSG_REV"
            cmake -S "$RUNNER_TEMP/phosg" -B "$RUNNER_TEMP/phosg-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps" \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            cmake --build "$RUNNER_TEMP/phosg-build" --parallel
            cmake --install "$RUNNER_TEMP/phosg-build"

            git clone https://github.com/fuzziqersoftware/resource_dasm "$RUNNER_TEMP/resource_dasm"
            git -C "$RUNNER_TEMP/resource_dasm" checkout "$RESOURCE_DASM_REV"
            cmake -S "$RUNNER_TEMP/resource_dasm" -B "$RUNNER_TEMP/resource_dasm-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps" \
              -DCMAKE_PREFIX_PATH="$deps" \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            cmake --build "$RUNNER_TEMP/resource_dasm-build" --parallel
            cmake --install "$RUNNER_TEMP/resource_dasm-build"
          fi

      - name: Download SDL_ttf dependencies
        run: |
          if [ ! -f vendored/SDL_ttf/external/freetype/CMakeLists.txt ]; then
            bash vendored/SDL_ttf/external/download.sh
          fi

      - name: Build macOS package
        run: |
          set -euxo pipefail
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/realmz-deps" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DSDLTTF_VENDORED=ON \
            -DSDLIMAGE_VENDORED=OFF
          cmake --build build-macos --target package --parallel
          dmg=$(find build-macos -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -noautoopen -plist > mount.plist
          mountpoint=$(python3 -c 'import plistlib; entities=plistlib.load(open("mount.plist","rb"))["system-entities"]; print(next(entity["mount-point"] for entity in entities if entity.get("mount-point")))')
          test -x "$mountpoint/Realmz.app/Contents/MacOS/Realmz"
          test -d "$mountpoint/Realmz.app/Contents/Resources/lib"
          find "$mountpoint/Realmz.app/Contents/Resources/lib" -type f -name 'libSDL3*.dylib' -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$mountpoint/Realmz.app/Contents/Info.plist" | grep -q true
          lipo "$mountpoint/Realmz.app/Contents/MacOS/Realmz" -verify_arch x86_64
          lipo "$mountpoint/Realmz.app/Contents/MacOS/Realmz" -verify_arch arm64
          cmp "base/Realmz/Realmz Music/Outdoor Music" "$mountpoint/Realmz.app/Contents/Resources/Realmz Music/Outdoor Music"
          cmp "base/Realmz/Data Files/The Family Jewels.rsrc" "$mountpoint/Realmz.app/Contents/Resources/Data Files/The Family Jewels.rsrc"
          otool -L "$mountpoint/Realmz.app/Contents/MacOS/Realmz"
          for library in "$mountpoint"/Realmz.app/Contents/Resources/lib/*.dylib; do
            lipo "$library" -verify_arch x86_64 arm64
            otool -L "$library"
          done
          hdiutil detach "$mountpoint"
          mv "$dmg" "Realmz-$RELEASE_TAG-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realmz-macOS
          path: Realmz-*-macOS.dmg

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required SDL projects
        shell: bash
        run: git submodule update --init vendored/SDL vendored/SDL_ttf vendored/SDL_image

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake ninja-build pkg-config zlib1g-dev gdb \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxrender-dev \
            libxss-dev libxtst-dev libasound2-dev libpulse-dev xvfb xauth

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/realmz-deps
          key: linux-deps-${{ env.PHOSG_REV }}-${{ env.RESOURCE_DASM_REV }}

      - name: Build native dependencies
        run: |
          set -euxo pipefail
          deps="$RUNNER_TEMP/realmz-deps"
          if [ ! -f "$deps/lib/cmake/phosg/phosgConfig.cmake" ]; then
            mkdir -p "$deps"
            git clone https://github.com/fuzziqersoftware/phosg "$RUNNER_TEMP/phosg"
            git -C "$RUNNER_TEMP/phosg" checkout "$PHOSG_REV"
            cmake -S "$RUNNER_TEMP/phosg" -B "$RUNNER_TEMP/phosg-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps"
            cmake --build "$RUNNER_TEMP/phosg-build" --parallel
            cmake --install "$RUNNER_TEMP/phosg-build"

            git clone https://github.com/fuzziqersoftware/resource_dasm "$RUNNER_TEMP/resource_dasm"
            git -C "$RUNNER_TEMP/resource_dasm" checkout "$RESOURCE_DASM_REV"
            cmake -S "$RUNNER_TEMP/resource_dasm" -B "$RUNNER_TEMP/resource_dasm-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$deps" \
              -DCMAKE_PREFIX_PATH="$deps"
            cmake --build "$RUNNER_TEMP/resource_dasm-build" --parallel
            cmake --install "$RUNNER_TEMP/resource_dasm-build"
          fi

      - name: Download SDL_ttf dependencies
        run: |
          if [ ! -f vendored/SDL_ttf/external/freetype/CMakeLists.txt ]; then
            bash vendored/SDL_ttf/external/download.sh
          fi

      - name: Build and package Linux build
        run: |
          set -euxo pipefail
          diagnostic_flags=()
          if [ '${{ inputs.linux_diagnostics }}' = true ]; then
            diagnostic_flags+=(-DREALMZ_ENABLE_ASAN=ON)
          fi
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/realmz-deps" \
            -DSDLTTF_VENDORED=ON \
            -DSDLIMAGE_VENDORED=OFF "${diagnostic_flags[@]}"
          cmake --build build-linux --target package --parallel -- -k 0
          package=$(find build-linux -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/music-package"
          tar -xzf "$package" -C "$RUNNER_TEMP/music-package"
          executable=$(find "$RUNNER_TEMP/music-package" -type f -name Realmz -print -quit)
          test -x "$executable"
          bindir=$(dirname "$executable")
          cmp "base/Realmz/Realmz Music/Outdoor Music" "$bindir/Realmz Music/Outdoor Music"
          cmp "base/Realmz/Data Files/The Family Jewels.rsrc" "$bindir/Data Files/The Family Jewels.rsrc"
          ldd "$executable" | tee linux-dependencies.txt
          ! grep -q "not found" linux-dependencies.txt
          set +e
          if [ '${{ inputs.linux_diagnostics }}' = true ]; then
            (cd "$bindir" && timeout --kill-after=5s 30s xvfb-run -a env SDL_AUDIODRIVER=dummy ASAN_OPTIONS=detect_leaks=0 \
              gdb --batch -ex 'set print thread-events off' -ex run -ex 'thread apply all bt' --args ./Realmz) > linux-smoke.log 2>&1
          else
            (cd "$bindir" && timeout --kill-after=5s 15s xvfb-run -a env SDL_AUDIODRIVER=dummy ./Realmz) > linux-smoke.log 2>&1
          fi
          smoke_status=$?
          set -e
          cat linux-smoke.log
          test "$smoke_status" -eq 124
          ! grep -E "Segmentation fault|Aborted|terminate called|AddressSanitizer" linux-smoke.log
          mv "$package" "Realmz-$RELEASE_TAG-Linux.tar.gz"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Realmz-Linux
          path: Realmz-*-Linux.tar.gz
